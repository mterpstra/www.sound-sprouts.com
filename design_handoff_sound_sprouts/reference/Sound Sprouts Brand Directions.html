<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sound Sprouts · Brand Refresh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300..700&family=DM+Sans:wght@400..800&family=Cormorant+Garamond:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0e0c; font-family: 'Inter', -apple-system, sans-serif; }
  #root { width: 100%; height: 100vh; }
  /* Recoleta isn't on Google Fonts — fallback gracefully to Nunito (rounded sans) for Direction 2 */
</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600..900&display=swap" rel="stylesheet" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="logos.jsx"></script>
<script type="text/babel" src="direction-sprout.jsx"></script>
<script type="text/babel" src="direction-phonics.jsx"></script>
<script type="text/babel" src="direction-press.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="logos" title="Logo — tip options" subtitle="Same Sprout (straight stem, brown soil hill touching the stem). Compare three options for what sits at the top: a seed, a bud, or a small flower.">
          <DCArtboard id="logo-original" label="Current logo" width={520} height={720}>
            <LogoOption isOriginal name="Current logo" description="Glossy blue badge with ornate A/B/C and a sprout. Multi-color, drop shadow, hard red ring." Mark={LogoMarkOriginal} bg={logoTokens.paper} />
          </DCArtboard>
          <DCArtboard id="logo-seed" label="A · Seed" width={520} height={720}>
            <LogoOption number="A" name="The Sprout · Seed" description="A simple terracotta circle at the tip — reads as a seed. Calmest, most graphic." Mark={(p) => <LogoMarkSprout {...p} tip="seed" />} />
          </DCArtboard>
          <DCArtboard id="logo-bud" label="B · Bud" width={520} height={720}>
            <LogoOption number="B" name="The Sprout · Bud" description="A small teardrop bud — about to open. More organic; suggests growth-in-progress." Mark={(p) => <LogoMarkSprout {...p} tip="bud" />} />
          </DCArtboard>
          <DCArtboard id="logo-flower" label="C · Flower" width={520} height={720}>
            <LogoOption number="C" name="The Sprout · Flower" description="Four small petals around a butter-yellow center. Warmest and most cheerful; reads kid-friendly." Mark={(p) => <LogoMarkSprout {...p} tip="flower" />} />
          </DCArtboard>
        </DCSection>
        <DCSection id="sprout" title="01 · Sprout & Soil" subtitle="Warm, growth-y, parental. Sage + cream + terracotta. Fraunces + Inter.">
          <DCArtboard id="sprout-id" label="Brand identity" width={1200} height={900}>
            <SproutIdentity />
          </DCArtboard>
          <DCArtboard id="sprout-hero" label="Homepage hero · applied" width={1440} height={900}>
            <SproutHero />
          </DCArtboard>
        </DCSection>

        <DCSection id="phonics" title="02 · Phonics Playground" subtitle="Playful, bouncy, child-forward. Butter + coral + sky. Recoleta-style display + DM Sans.">
          <DCArtboard id="phonics-id" label="Brand identity" width={1200} height={900}>
            <PhonicsIdentity />
          </DCArtboard>
          <DCArtboard id="phonics-hero" label="Homepage hero · applied" width={1440} height={900}>
            <PhonicsHero />
          </DCArtboard>
        </DCSection>

        <DCSection id="press" title="03 · Storybook Press" subtitle="Editorial children's-book-jacket feel. Cream paper, deep ink, single rust accent. Cormorant + Inter.">
          <DCArtboard id="press-id" label="Brand identity" width={1200} height={900}>
            <PressIdentity />
          </DCArtboard>
          <DCArtboard id="press-hero" label="Homepage hero · applied" width={1440} height={900}>
            <PressHero />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
